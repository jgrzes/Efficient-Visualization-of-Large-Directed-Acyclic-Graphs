services:
  mongo:
    image: mongo:7
    container_name: mongo_local
    command: ["--auth", "--wiredTigerCacheSizeGB", "0.75", "--quiet"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-rootpass}
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:-inz_user}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:-devpass}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-inz}
    ports:
      - "27017:27017"
    volumes:
      - ./data:/data/db
      - ./init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - dag-app-db-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u root -p rootpass --eval 'db.runCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  python-backend:
    build: 
      context: ./app
      dockerfile: ./python-backend/Dockerfile
    environment:
      MONGODB_URI: "mongodb://inz_user:devpass@mongo:27017/inz?authSource=inz"
      MONGO_DB_NAME: "inz"
      SERVICE_IP_ADDRESS: "0.0.0.0"
      SERVICE_PORT: "30301"
      LAYOUT_SERVICE_IP_ADDRESS: "cpp-backend"
      LAYOUT_SERVICE_PORT: "30311"
      MAX_CONTENT_LENGTH_MB: "100"
      GUNICORN_WORKERS: "1"
      GUNICORN_TIMEOUT: "1200"
    ports:
      - "30301-30305:30301-30305"
    volumes:
      - ./app/python-backend:/app
    stdin_open: true
    tty: true
    networks:
      - dag-app-db-network
      - dag-app-py-front-network
      - dag-app-py-cpp-network
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build: ./app/frontend
    ports:
      - "30306-30310:30306-30310"
    volumes:
      - ./app/frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    networks:
      - dag-app-py-front-network
    depends_on:
      - python-backend

  cpp-backend:
    build: ./app/cpp-backend
    ports:
      - "30311-30315:30311-30315"
    volumes:
      - ./app/cpp-backend:/app
      - ./app/proto:/proto:ro
    stdin_open: true
    tty: true
    networks:
      - dag-app-py-cpp-network

networks:
  dag-app-db-network:
  dag-app-py-front-network:
  dag-app-py-cpp-network:
